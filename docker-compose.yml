services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Real keys live in .env (never committed). See .env.example for every variable.
      LLM_API_KEYS: ${LLM_API_KEYS:?set LLM_API_KEYS in .env (comma-separated, at least 2 keys)}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
      LLM_API_BASE: ${LLM_API_BASE:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      KEY_COOLDOWN_SECONDS: ${KEY_COOLDOWN_SECONDS:-60}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-40}
    volumes:
      - chat_data:/data   # SQLite file lives here, so history survives restarts
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      # The browser calls the backend directly, so this is the *public* backend URL.
      API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chat_data:
